name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Oldest Go that go.mod supports.
          - os: ubuntu-latest
            go: "1.22"
          # Go 1.22 test binaries lack LC_UUID and abort on current macOS,
          # so macOS runs on the same Go the release builds with.
          - os: ubuntu-latest
            go: "1.27"
          - os: macos-latest
            go: "1.27"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - run: go test ./...
      - run: go build -o a2h ./cmd/a2h
